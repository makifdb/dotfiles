# allow reload of this file with PRE r
bind r source-file ~/.tmux.conf \; display "Reloaded."

# x kills pane
bind-key x kill-pane

# -r repeat time (Default 500 millis)
set -g repeat-time 2000

# colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# mouse mode (scrolling, etc)
setw -g mouse on

# remove delay
set -sg escape-time 10

# support modified keys
set -g extended-keys on
set -g extended-keys-format csi-u

# set {window,pane} index to start at 1, and keep them contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# tmux default of 2000 lines fills up fast with long command output
set -g history-limit 50000

# vim style through panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim style through windows (PRE Control-H/L)
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# vim style through resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window list: "[1] analyzify:claude", keeping the bell and zoom flags
set -g window-status-format "[#I] #W#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,}"
set -g window-status-current-format "[#I] #W#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,}"
set -g window-status-separator "  "

# highlight active window
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=white,bold"

# statusbar: blend into the terminal background; session name is dimmed so
# the brackets stay unambiguous as the window index
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=brightblack]#S  "
set -g status-left-length 20

# add time with h:m to statusbars right side
set -g status-right "#[fg=white]%H:%M"

# --- Claude Code ---------------------------------------------------------
# let OSC sequences (desktop notifications, progress bar) reach the outer
# terminal instead of being swallowed by tmux
set -g allow-passthrough on
set -as terminal-features ",xterm*:extkeys"

# focus tracking, so Claude knows when its pane is in the background
set -g focus-events on
# the focus-out re-render writes to stdout and would otherwise show up as
# pane activity (anthropics/claude-code#30199)
set -g activity-action none

# Claude's binary is named after its version, so automatic-rename turns the
# window into "2.1.278" -- show the working directory and "claude" instead
set -g automatic-rename-format '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},#{b:pane_current_path}:claude,#{pane_current_command}}'
